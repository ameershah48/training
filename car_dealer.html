<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Car Dealer</title>
	<link rel="stylesheet" href="dealer.css" type="text/css" />
	<script type="text/javascript" language="javascript" src="jquery/js/jquery-1.8.3.js"></script>
	<script type="text/javascript" language="javascript" src="jquery/js/jquery-ui-1.9.2.custom.js"></script>
	<script type="text/javascript" language="javascript" src="dealer.js"></script>
</head>

<body>
	<div id="salon">
		<div id="clients_queue">
			clients queue
		</div>
		<div id="cars_place">
			<div id="porsche" class="place">
				<img src="images/Porsche_1.jpg" alt="">
				<img src="images/Porsche_1.jpg" alt="">
				<img src="images/Porsche_1.jpg" alt="">
				<img src="images/Porsche_1.jpg" alt="">
			</div>
			<div id="volkswagen" class="place">
				<img src="images/Volkswagen_1.jpg" alt="">
				<img src="images/Volkswagen_2.jpg" alt="">
				<img src="images/Volkswagen_3.jpg" alt="">
				<img src="images/Volkswagen_4.jpg" alt="">
				<img src="images/Volkswagen_5.jpg" alt="">
				<img src="images/Volkswagen_6.jpg" alt="">
			</div>
			<div id="audi" class="place">
				<img src="images/Audi_1.jpg" alt="">
				<img src="images/Audi_2.jpg" alt="">
				<img src="images/Audi_3.jpg" alt="">
				<img src="images/Audi_4.jpg" alt="">
				<img src="images/Audi_5.jpg" alt="">
			</div>
			<div id="bmw" class="place">
				<img src="images/BMW_1.jpg" alt="">
				<img src="images/bmw_2.jpg" alt="">
				<img src="images/bmw_3.jpg" alt="">
			</div>
		</div>
		<div id="cashier">
			cashier
			<img src="images/cashier.jpg" alt="">
		</div>
		<div id="exit">
			exit
			<img src="images/exit.jpg" alt="">
		</div>
		<div id="display">
			<ul>
				<li id="clients_served">10 clients</li>
				<li id="cars_sold">10 cars</li>
				<li id="amount">€ 120.000,00</li>
			</ul>
		</div>
	</div>
</body>

</html>
